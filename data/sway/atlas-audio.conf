# Project Atlas · Atlas Audio para sway
# Uso: añade en tu config de sway (~/.config/i3/config):
#   include ~/.local/share/audio-profile/sway/atlas-audio.conf
#
# El daemon (audio-profile-watch.service) lo arranca systemd, no sway.
# Solo necesita SWAYSOCK en el entorno de systemd para detectar la pestaña
# de YouTube: lo hace tu línea `exec_always systemctl --user import-environment ... SWAYSOCK`.

# Ventana flotante y centrada, como gpu-control y cpu-control
for_window [app_id="org.atlas.AudioControl"] floating enable, resize set 1280 880, move position center

# $mod+a abre Atlas Audio
bindsym $mod+a exec @BINDIR@/atlas-audio

# $mod+Shift+a entra en el modo Audio (una tecla y vuelve solo)
set $atlas_mode "Audio:   f:FPS   r:Carreras   v:Aventura   g:Juegos  󰯉 e:Retro   y:YouTube   m:Música   n:Navegar   c:Cine   s:Mi sonido   h:Auriculares   a:Auto   x:Recuperar   t:Tono   o:App"
bindsym $mod+Shift+a mode $atlas_mode

mode $atlas_mode {
    bindsym f exec @BINDIR@/audio-profile apply fps       && notify-send -a "Atlas Audio" "Perfil" "FPS / Competitivo", mode "default"
    bindsym r exec @BINDIR@/audio-profile apply racing    && notify-send -a "Atlas Audio" "Perfil" "Carreras", mode "default"
    bindsym v exec @BINDIR@/audio-profile apply adventure && notify-send -a "Atlas Audio" "Perfil" "Aventura / RPG", mode "default"
    bindsym g exec @BINDIR@/audio-profile apply gaming    && notify-send -a "Atlas Audio" "Perfil" "Juegos", mode "default"
    bindsym e exec @BINDIR@/audio-profile apply retro     && notify-send -a "Atlas Audio" "Perfil" "RetroArch / Retro", mode "default"
    bindsym y exec @BINDIR@/audio-profile apply video     && notify-send -a "Atlas Audio" "Perfil" "YouTube y vídeo", mode "default"
    bindsym m exec @BINDIR@/audio-profile apply music     && notify-send -a "Atlas Audio" "Perfil" "Música", mode "default"
    bindsym n exec @BINDIR@/audio-profile apply browsing  && notify-send -a "Atlas Audio" "Perfil" "Navegar", mode "default"
    bindsym c exec @BINDIR@/audio-profile apply cinema    && notify-send -a "Atlas Audio" "Perfil" "Cine 5.1", mode "default"
    bindsym s exec @BINDIR@/audio-profile apply personal  && notify-send -a "Atlas Audio" "Perfil" "Mi sonido", mode "default"

    # altavoces 5.1 <-> auriculares (también cambia solo al enchufar)
    bindsym h exec sh -c '@BINDIR@/audio-profile output toggle | tail -1 | xargs -0 notify-send -a "Atlas Audio" "Salida"', mode "default"

    # elegir un perfil a mano pausa el modo automático; [a] lo reanuda
    bindsym a exec @BINDIR@/audio-profile auto on && notify-send -a "Atlas Audio" "Perfiles automáticos" "Reanudados", mode "default"

    bindsym x exec sh -c '@BINDIR@/audio-profile recover >/dev/null && notify-send -a "Atlas Audio" "Audio" "Funcionando (verificado)" || notify-send -u critical -a "Atlas Audio" "Audio" "No se pudo recuperar: abre Atlas Audio → Recuperación"', mode "default"
    bindsym t exec @BINDIR@/audio-profile test-tone, mode "default"
    bindsym o exec @BINDIR@/atlas-audio, mode "default"

    bindsym Escape mode "default"
    bindsym Return mode "default"
}
