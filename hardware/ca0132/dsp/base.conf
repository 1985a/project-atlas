# Configuración mínima de altavoces (de fábrica) para Sound Blaster Z en 5.1.
# Si importaste tu asound.state (audio-profile base import), se usa TU base.conf
# en ~/.config/audio-profile/hardware/ca0132/dsp/ en lugar de este.
Output Select=Speakers
Surround Channel Config=5.1
Enable OutFX Playback Switch=on
HP/Speaker Auto Detect Playback Switch=off
