# Música: dinámica intacta, graves y aire suaves para satélites pequeños
# Generado para Sound Blaster Z + Logitech X-530 (base.conf se aplica antes).

FX: Surround Playback Switch=off
FX: Crystalizer Playback Switch=on
FX: Crystalizer Playback Volume=15
FX: Dialog Plus Playback Switch=off
FX: Smart Volume Playback Switch=off
FX: X-Bass Playback Switch=on
FX: X-Bass Playback Volume=25
# X-Bass crossover: 80 Hz
FX: X-Bass Crossover Playback Volume=8
FX: Equalizer Playback Switch=on
FX: Equalizer Preset Switch=Flat
# EQ: 31:+2  62:+2  125:+1  250:+0  500:+0  1k:+0  2k:+0  4k:+1  8k:+2  16k:+1 dB
EQ Band0 Playback Volume=26
EQ Band1 Playback Volume=26
EQ Band2 Playback Volume=25
EQ Band3 Playback Volume=24
EQ Band4 Playback Volume=24
EQ Band5 Playback Volume=24
EQ Band6 Playback Volume=24
EQ Band7 Playback Volume=25
EQ Band8 Playback Volume=26
EQ Band9 Playback Volume=25
